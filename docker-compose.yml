# ============================================================================
# InvestRing 生产环境 Docker Compose 配置
# ============================================================================
# 目标环境：阿里云轻量服务器 2核2GB + RDS MySQL
# 使用方式：docker compose up -d
# 包含：后端 + 前端 + Nginx 反向代理（数据库使用阿里云 RDS）
# ============================================================================

services:
  # --------------------------------------------------------------------------
  # 后端服务：FastAPI + Uvicorn (2 workers，适配 2 核)
  # --------------------------------------------------------------------------
  backend:
    image: ghcr.io/gujialind/investring/backend:latest
    container_name: investring-backend
    restart: unless-stopped
    # 不直接暴露端口，仅通过 Nginx 内部网络访问
    expose:
      - "8000"
    env_file:
      - .env
    networks:
      - investring-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    # 2GB 内存环境下的资源限制
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "1.0"
        reservations:
          memory: 200M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # --------------------------------------------------------------------------
  # 前端服务：Next.js 生产模式
  # --------------------------------------------------------------------------
  frontend:
    image: ghcr.io/gujialind/investring/frontend:latest
    container_name: investring-frontend
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      # Next.js rewrite 代理目标地址（容器间通信用 Docker 网络名）
      - API_BASE_URL=http://backend:8000
    networks:
      - investring-net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "1.0"
        reservations:
          memory: 200M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # --------------------------------------------------------------------------
  # Nginx 反向代理：唯一对外暴露的入口
  # --------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: investring-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - investring-net
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

networks:
  investring-net:
    driver: bridge
