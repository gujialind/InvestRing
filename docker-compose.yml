# ============================================================================
# InvestRing 生产环境 Docker Compose 配置（仅后端）
# ============================================================================
# 目标环境：4核4G 云服务器 + 云 RDS MySQL
# 部署目录：/opt/investring（compose 文件由 CD 自动同步，.env 人工维护）
# 镜像版本：由 .env 中的 BACKEND_IMAGE_REF 指定（CD 部署时自动更新该行）
# 前端暂未部署，后续部署时再补充 frontend / nginx 服务。
# ============================================================================

services:
  # --------------------------------------------------------------------------
  # 后端服务：FastAPI + Uvicorn（2 workers，nav_sync 定时任务经 MySQL GET_LOCK 互斥）
  # 启动时应用自动执行 alembic upgrade head
  # --------------------------------------------------------------------------
  backend:
    image: ${BACKEND_IMAGE_REF:?BACKEND_IMAGE_REF 未设置，请在 .env 中指定后端镜像}
    container_name: investring-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    networks:
      - investring-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # 4G 内存环境下为后端预留充足资源（其余留给系统与未来的前端）
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
        reservations:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  investring-net:
    driver: bridge
