# ============================================================================
# InvestRing Nginx 反向代理配置（域名 investring.top）
# ============================================================================
# 两阶段切换（当前处于阶段一）：
#   阶段一（备案审核期，无证书）：80 端口直接承载全部业务路由，HTTP + IP 均可访问
#   阶段二（备案通过 + 证书签发后）：
#     1. 删除下方「阶段一」server 块中的业务 location（保留 ACME + 301 跳转）
#     2. 取消「阶段二」HTTPS server 块的注释
#
# 路由规划：
#   /           前端 Next.js (frontend:7860，端口为兼容魔搭 Studio 固定)
#   /api/       后端 FastAPI (backend:8000)
#   /docs /redoc /openapi.json /health → 后端
#
# 证书签发（宿主机，备案通过后首次）：
#   certbot certonly --webroot -w /opt/investring/certbot/www -d investring.top
# 续期后重载：certbot renew --deploy-hook "docker exec investring-nginx nginx -s reload"
# ============================================================================

worker_processes 2;  # 适配 4 核服务器（nginx 仅做反代，2 worker 足够）
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # 性能优化
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip 压缩（减小传输体积）
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/atom+xml image/svg+xml;

    # 限流配置（防止 API 被滥用）
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    # 安全 Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 上游服务定义
    upstream backend {
        server backend:8000;
    }

    upstream frontend {
        # 前端容器监听 7860（Dockerfile 为兼容魔搭 Studio 固定该端口）
        server frontend:7860;
    }

    return 301 https://$host$request_uri

    # ========================================================================
    # 阶段一：HTTP 主服务器（备案审核期，域名/IP 均走此入口）
    # 阶段二启用后：删除业务 location，仅保留 ACME 验证 + 301 跳转
    # ========================================================================
    # server {
    #     listen 80 default_server;
    #     server_name investring.top;

    #     # Let's Encrypt HTTP-01 验证（certbot webroot 目录，见 docker-compose 挂载）
    #     location /.well-known/acme-challenge/ {
    #         root /var/www/certbot;
    #     }

    #     # ---- 以下业务路由在阶段二删除，替换为：return 301 https://$host$request_uri; ----

    #     # 前端静态资源缓存
    #     location /_next/static/ {
    #         proxy_pass http://frontend;
    #         proxy_cache_valid 200 365d;
    #         add_header Cache-Control "public, max-age=31536000, immutable";
    #     }

    #     # 后端 API 路由
    #     location /api/ {
    #         proxy_pass http://backend;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;

    #         # 限流
    #         limit_req zone=api_limit burst=50 nodelay;

    #         # 超时设置
    #         proxy_connect_timeout 30s;
    #         proxy_send_timeout 60s;
    #         proxy_read_timeout 60s;
    #     }

    #     # FastAPI 文档路由（生产环境建议关闭）
    #     location /docs {
    #         proxy_pass http://backend;
    #         proxy_set_header Host $host;
    #     }

    #     location /redoc {
    #         proxy_pass http://backend;
    #         proxy_set_header Host $host;
    #     }

    #     location /openapi.json {
    #         proxy_pass http://backend;
    #         proxy_set_header Host $host;
    #     }

    #     # 后端健康检查端点
    #     location /health {
    #         proxy_pass http://backend;
    #         proxy_set_header Host $host;
    #     }

    #     # 前端路由（兜底规则）
    #     location / {
    #         proxy_pass http://frontend;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #     }
    # }

    # ========================================================================
    # 阶段二：HTTPS 主服务器（备案通过并签发证书后取消注释启用）
    # ========================================================================
    server {
        listen 443 ssl;
        http2 on;
        server_name investring.top;
    
        # Let's Encrypt 证书（宿主机 /etc/letsencrypt 只读挂载）
        ssl_certificate /etc/letsencrypt/live/investring.top/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/investring.top/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
    
        # HSTS（仅 HTTPS 生效后开启）
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
        # 前端静态资源缓存
        location /_next/static/ {
            proxy_pass http://frontend;
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    
        # 后端 API 路由
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            limit_req zone=api_limit burst=50 nodelay;
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    
        # FastAPI 文档路由（生产环境建议关闭）
        location /docs {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }
    
        location /redoc {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }
    
        location /openapi.json {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }
    
        # 后端健康检查端点
        location /health {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }
    
        # 前端路由（兜底规则）
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
