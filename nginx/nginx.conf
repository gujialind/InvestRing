# ============================================================================
# InvestRing Nginx 反向代理配置
# ============================================================================
# 统一入口：
#   /           → 前端 Next.js (3000)
#   /api/       → 后端 FastAPI (8000)
#   /docs       → 后端 Swagger 文档
#   /redoc      → 后端 ReDoc 文档
#   /openapi.json → 后端 OpenAPI Schema
# ============================================================================

worker_processes 2;  # 适配 2 核服务器
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # 性能优化
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip 压缩（减小传输体积）
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/atom+xml image/svg+xml;

    # 安全 Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 限流配置（防止 API 被滥用）
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    # 上游服务定义
    upstream backend {
        server backend:8000;
    }

    upstream frontend {
        server frontend:3000;
    }

    # ========================================================================
    # 主服务器配置（HTTP）
    # ========================================================================
    server {
        listen 80;
        server_name _;  # 替换为你的域名，如 investring.example.com

        # 前端静态资源缓存
        location /_next/static/ {
            proxy_pass http://frontend;
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # 后端 API 路由
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 限流
            limit_req zone=api_limit burst=50 nodelay;

            # 超时设置
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # FastAPI 文档路由（生产环境建议关闭）
        location /docs {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        location /redoc {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        # 后端健康检查端点
        location /health {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        # 前端路由（兜底规则）
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket 支持（Next.js HMR 需要，生产环境可移除）
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # ========================================================================
    # HTTPS 配置（取消注释并配置证书后启用）
    # ========================================================================
    # server {
    #     listen 443 ssl http2;
    #     server_name investring.example.com;
    #
    #     ssl_certificate /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    #     ssl_prefer_server_ciphers off;
    #
    #     # HSTS
    #     add_header Strict-Transport-Security "max-age=63072000" always;
    #
    #     # ... 与上方 server 块相同的 location 配置 ...
    # }
    #
    # # HTTP → HTTPS 强制跳转
    # server {
    #     listen 80;
    #     server_name investring.example.com;
    #     return 301 https://$server_name$request_uri;
    # }
}
