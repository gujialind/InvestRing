[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "investring"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.25",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.6",
    "pymysql>=1.1.0",
    "pandas>=2.1.4",
    "numpy>=1.26.3",
    "python-dateutil>=2.8.2",
    "httpx>=0.26.0",
    "requests>=2.28.0",
    "apscheduler>=3.10.4",
    "alembic>=1.13.1",
    "tushare>=1.4.14",
    "akshare>=1.18.94",
    "lxml>=6.0.0",
    "simplejson>=4.1.0",
    "click>=8.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "factory-boy>=3.3.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

# pytest 配置收纳（issue #172）：此前 --strict-markers 依赖 CI 命令行传递，
# 本地裸跑 pytest 无此保护。当前无自定义 marker（仅内建 parametrize），
# 新增自定义 marker 时须在此登记，否则 --strict-markers 会拒绝运行。
[tool.pytest.ini_options]
addopts = "--strict-markers"
