# ============================================================================
# InvestRing CD 持续部署流水线（仅后端）
# ============================================================================
# 触发条件：
#   1. main 分支 CI 通过后自动部署
#   2. 手动触发（workflow_dispatch）：可指定已有镜像 tag 重新部署/回滚
#
# 部署链路：构建后端镜像 → 推送阿里云 ACR → SSH 到服务器拉取并重启
# 目标环境：4核4G 云服务器（仅 backend 容器）+ 云 RDS MySQL
# 前端暂未部署，不在本流水线范围内。
#
# 需要配置的 GitHub Secrets：
#   ACR_REGISTRY   - ACR 地址，如 registry.cn-hangzhou.aliyuncs.com
#   ACR_NAMESPACE  - ACR 命名空间
#   ACR_USERNAME   - ACR 登录用户名
#   ACR_PASSWORD   - ACR 登录密码
#   SERVER_HOST    - 服务器 IP
#   SERVER_USER    - SSH 用户名
#   SERVER_SSH_KEY - SSH 私钥
#
# 服务器约定：
#   部署目录 /opt/investring；应用配置 .env 由服务器人工维护，CD 不覆盖。
# ============================================================================

name: Deploy

on:
  # main 分支 CI 通过后自动触发
  workflow_run:
    workflows: ["CI"]
    types: [completed]

  # 手动触发：留空 image_tag 则构建触发分支当前 commit 并部署；
  # 填写已有 tag（如短 commit SHA）则跳过构建直接部署该版本（用于回滚）
  workflow_dispatch:
    inputs:
      image_tag:
        description: "部署已有镜像 tag（留空则构建最新代码）"
        required: false
        type: string

# 部署串行执行，不可中途取消
concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  BACKEND_IMAGE: ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/investring-backend

jobs:
  # ==========================================================================
  # 前置判断：确定是否部署、部署哪个版本
  # ==========================================================================
  setup:
    name: "确定部署版本"
    runs-on: ubuntu-latest
    # workflow_run 仅在 main 分支 CI 成功时继续；手动触发总是继续
    if: >
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main') ||
      github.event_name == 'workflow_dispatch'
    outputs:
      # 要部署的镜像 tag
      image_tag: ${{ steps.ver.outputs.image_tag }}
      # 是否需要构建（手动指定已有 tag 时跳过构建）
      need_build: ${{ steps.ver.outputs.need_build }}
      # 构建所用的代码 commit
      checkout_ref: ${{ steps.ver.outputs.checkout_ref }}
    steps:
      - name: 计算镜像版本
        id: ver
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ github.event.inputs.image_tag }}" ]; then
            # 手动指定已有 tag：直接部署，不构建
            echo "image_tag=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
            echo "need_build=false" >> $GITHUB_OUTPUT
            echo "checkout_ref=main" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" == "workflow_run" ]; then
            # CI 触发：部署 CI 对应的 commit（workflow_run 事件中 github.sha 是默认分支，
            # 必须用 head_sha 才能与 CI 校验的代码一致）
            SHA="${{ github.event.workflow_run.head_sha }}"
            echo "image_tag=${SHA:0:7}" >> $GITHUB_OUTPUT
            echo "need_build=true" >> $GITHUB_OUTPUT
            echo "checkout_ref=$SHA" >> $GITHUB_OUTPUT
          else
            # 手动触发且未指定 tag：构建触发分支当前 commit 的代码
            # 镜像必须从触发 commit 构建（checkout_ref 与 image_tag 均取 github.sha），
            # 避免镜像内容与生产 DB 的 alembic 迁移版本错位导致启动失败
            SHA="${{ github.sha }}"
            echo "image_tag=${SHA:0:7}" >> $GITHUB_OUTPUT
            echo "need_build=true" >> $GITHUB_OUTPUT
            echo "checkout_ref=$SHA" >> $GITHUB_OUTPUT
          fi

  # ==========================================================================
  # 构建后端镜像并推送至阿里云 ACR
  # ==========================================================================
  build-and-push:
    name: "构建镜像 & 推送 ACR"
    needs: setup
    if: needs.setup.outputs.need_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.setup.outputs.checkout_ref }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ needs.setup.outputs.image_tag }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================================================
  # SSH 部署到服务器（拉取镜像 → 重启容器 → 健康检查 → 失败自动回滚）
  # ==========================================================================
  deploy:
    name: "部署到生产服务器"
    needs: [setup, build-and-push]
    # build 被跳过（部署已有 tag）时也要继续
    if: >
      !cancelled() && needs.setup.result == 'success' &&
      (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.setup.outputs.checkout_ref }}

      # 同步 docker-compose.yml 到服务器（.env 由服务器人工维护，不覆盖）
      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/opt/investring"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -e
            cd /opt/investring
            IMAGE="${{ env.BACKEND_IMAGE }}:${{ needs.setup.outputs.image_tag }}"

            echo "============================================"
            echo "  InvestRing 后端部署"
            echo "  镜像: $IMAGE"
            echo "============================================"

            # 0. 前置检查：.env 必须已由人工配置好（CD 只更新 BACKEND_IMAGE_REF 一行）
            if [ ! -f .env ]; then
              echo "❌ /opt/investring/.env 不存在，请先在服务器上配置应用环境变量"
              exit 1
            fi

            # 将镜像版本写入 .env（仅替换/追加 BACKEND_IMAGE_REF 行，其余配置不动），
            # 保证后续人工 docker compose up -d 也能拉起正确版本
            update_image_ref() {
              if grep -q '^BACKEND_IMAGE_REF=' .env; then
                sed -i "s|^BACKEND_IMAGE_REF=.*|BACKEND_IMAGE_REF=$1|" .env
              else
                echo "BACKEND_IMAGE_REF=$1" >> .env
              fi
            }

            # 1. 登录 ACR 并拉取新镜像（先拉后停，缩短停机时间）
            echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ secrets.ACR_REGISTRY }} \
              -u "${{ secrets.ACR_USERNAME }}" --password-stdin
            docker pull "$IMAGE"

            # 2. 记录当前运行版本（用于失败回滚）
            PREV_IMAGE=$(docker inspect --format '{{.Config.Image}}' investring-backend 2>/dev/null || true)
            echo "当前版本: ${PREV_IMAGE:-<无>}"

            # 3. 移除同名旧容器（兼容早期人工 docker run 部署的容器）
            docker rm -f investring-backend 2>/dev/null || true

            # 4. 启动新容器（应用启动时自动执行 alembic upgrade head）
            update_image_ref "$IMAGE"
            docker compose up -d --remove-orphans

            # 5. 健康检查（最长等待 120s，覆盖迁移执行时间）
            echo "执行健康检查..."
            HEALTHY=false
            for i in $(seq 1 60); do
              if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
                HEALTHY=true
                break
              fi
              sleep 2
            done

            if [ "$HEALTHY" != "true" ]; then
              echo "❌ 健康检查超时，输出容器日志："
              docker logs --tail 100 investring-backend || true
              if [ -n "$PREV_IMAGE" ]; then
                echo "🔄 回滚到上一版本: $PREV_IMAGE"
                docker rm -f investring-backend 2>/dev/null || true
                update_image_ref "$PREV_IMAGE"
                docker compose up -d
              fi
              exit 1
            fi
            echo "✅ 健康检查通过"

            # 6. 清理悬空旧镜像，释放磁盘
            docker image prune -f

            echo "============================================"
            echo "  ✅ 部署完成: $IMAGE"
            echo "============================================"
