name: Deploy to Volcano Engine

on:
  push:
    branches: [dev]
    paths-ignore:
      - 'Docs/**'
      - '**.md'
      - '.github/**'
  workflow_dispatch:
    inputs:
      rebuild:
        description: '重建 Docker 镜像 (依赖变更时勾选)'
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VOLCANO_HOST }}
          username: ${{ secrets.VOLCANO_USER }}
          key: ${{ secrets.VOLCANO_SSH_KEY }}
          script: |
            set -e
            cd /root/InvestRing

            echo "📥 Pulling latest code..."
            git pull origin dev
            echo "HEAD: $(git log --oneline -1)"

            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.rebuild }}" = "true" ]; then
              echo "🔨 Rebuilding Docker image..."
              docker compose build backend
            fi

            echo "🔄 Restarting backend..."
            docker compose up -d backend

            sleep 3

            echo "🏥 Health check..."
            curl -fsS http://localhost:8000/health
            echo ""
            echo "✅ Deploy done: $(date)"
