# ============================================================================
# InvestRing CI 持续集成流水线
# ============================================================================
# 范围：后端测试 + CLI 契约校验 + 前端 lint/类型/构建门禁 + 前端 E2E（issue #168）
# 触发条件：push 或 pull request 到 main/dev 分支
# 测试数据库：
#   - SQLite（conftest.py 默认模式，快速反馈）
#   - MySQL 8.4 service 容器（对齐生产 RDS，覆盖方言差异 + 迁移链验证）
# ============================================================================

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# 并发控制：同一源分支只保留最新的运行。
# head_ref（PR 源分支名）优先，push 事件回落到 ref_name（分支名），
# 使 push 到 dev 与 dev→main PR 落入同一组，避免同一 commit 重复运行。
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: "Backend Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Python 版本与生产镜像（python:3.12-slim）保持一致
      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # SQLite 模式运行全量测试（unit + integration + e2e）；
      # 覆盖率仅在本 job 收集（不设阈值，先度量观察基线，issue #171）
      - name: Run tests with pytest
        env:
          SECRET_KEY: test-secret-key-for-ci
          SCHEDULER_ENABLED: "false"
        run: |
          pytest tests/ -q --tb=short --strict-markers --cov=app --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 14

  # MySQL 门禁：覆盖 SQLite 测不出的方言差异（VARCHAR 长度、DECIMAL 截断、
  # 隐式排序、排序规则等），并验证生产启动顺序（create_all → alembic upgrade head）
  backend-test-mysql:
    name: "Backend Tests (MySQL)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 库级排序规则对齐生产 RDS（utf8mb3_general_ci，建表默认继承库级设置）
      - name: Create databases
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "
            CREATE DATABASE ir_test CHARACTER SET utf8mb3 COLLATE utf8mb3_general_ci;
            CREATE DATABASE ir_migration CHARACTER SET utf8mb3 COLLATE utf8mb3_general_ci;"

      # 复刻生产启动顺序：main.py import 期 create_all 建全表，lifespan 内 upgrade head 增量修补
      - name: Verify migration chain (create_all + alembic upgrade head)
        env:
          DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/ir_migration?charset=utf8mb4
          SECRET_KEY: test-secret-key-for-ci
          SCHEDULER_ENABLED: "false"
          DEBUG: "false"
          # 可逆性豁免开关：仅限引入不可逆迁移（如 DROP 列）的 PR 临时置 true，
          # 合入后必须改回 false（issue #170）
          SKIP_DOWNGRADE: "false"
        run: |
          python -c "from app.database import engine, Base; import app.models; Base.metadata.create_all(bind=engine)"
          alembic upgrade head
          alembic current | grep "(head)"
          # 可逆性验证：downgrade -1 只回退最新一条迁移（已知不可逆的 0006/0008 不会被触碰）
          if [ "${SKIP_DOWNGRADE}" != "true" ]; then
            alembic downgrade -1
            alembic upgrade head
            alembic current | grep "(head)"
          else
            echo "::warning::SKIP_DOWNGRADE=true，跳过迁移可逆性验证，合入后请移除此豁免"
          fi

      - name: Run tests with pytest (MySQL)
        env:
          TEST_DB_URL: mysql+pymysql://root:root@127.0.0.1:3306/ir_test?charset=utf8mb4
          SECRET_KEY: test-secret-key-for-ci
          SCHEDULER_ENABLED: "false"
          DEBUG: "false"
        run: |
          pytest tests/ -q --tb=short --strict-markers

  # CLI 契约防漂移校验（issue #170 扩展）：
  #   1. openapi.json 漂移门禁——进程内生成 schema 与已提交契约比对
  #   2. ir-cli 响应字段契约校验
  #   3. ir-cli 单元测试
  cli-contract-check:
    name: "CLI Contract Check"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      # openapi.json 漂移门禁：改 router/schema 忘记重新导出时 exit 1
      # （import app.main 会对临时 sqlite 执行 create_all + init_scheduled_tasks，无需起服务）
      - name: Check openapi.json drift
        env:
          SECRET_KEY: test-secret-key-for-ci
          SCHEDULER_ENABLED: "false"
        run: python backend/check_openapi.py

      # 不一致时 exit 1：请运行 `python ir-cli/scripts/gen_response_fields.py` 重新生成并提交
      - name: Check response fields contract
        run: |
          python ir-cli/scripts/gen_response_fields.py --check

      - name: Install ir-cli and run unit tests
        run: |
          pip install -e ir-cli pytest
          pytest ir-cli/tests -q

  # 前端门禁：前端已容器化部署，类型/语法错误与构建失败必须在 CI 拦住
  # （历史上因无前端门禁漏过任务页 map 崩溃等问题）
  frontend-check:
    name: "Frontend Lint & Build"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Node 版本与 frontend/Dockerfile、frontend/.nvmrc 保持一致
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npx tsc --noEmit

      # next build 内部也会跑 lint + tsc，但单独前置两步能更快定位失败原因
      - name: Next.js build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  # 前端 E2E 门禁（issue #168）：真实浏览器验证登录/页面渲染/防 P0 复发，
  # 拦截"接口正确但用户用不了"的问题（白屏崩溃、死链、双导航等）。
  # 后端跑在 MySQL 8.4 上（对齐 backend-test-mysql 的"对齐生产 RDS"哲学）。
  #
  # 运行前提（勿删）：
  #   - E2E 登录用例依赖 ADMIN/admin@2026 用户，该用户不会随后端启动自动创建，
  #     必须由 scripts/init_data.py 种子产生，删除 seed 步骤登录必挂
  #   - 前端 next.config.js 将 /api/* rewrite 到 localhost:8000，故需真实后端
  frontend-e2e:
    name: "Frontend E2E"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # ---- 后端：建库 → 迁移 → seed → 启动（生产启动顺序：create_all 由 main.py import 期完成）----
      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 库级排序规则对齐 backend-test-mysql（utf8mb3_general_ci）
      - name: Create database
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "
            CREATE DATABASE ir_e2e CHARACTER SET utf8mb3 COLLATE utf8mb3_general_ci;"

      # 复刻生产启动顺序（对齐 backend-test-mysql）：create_all 先建全表，
      # alembic upgrade head 增量修补——迁移链依赖 create_all 已建表
      # （如 0007 直接 UPDATE product），单独跑迁移会报表不存在
      - name: Create schema and run migrations
        working-directory: backend
        env:
          DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/ir_e2e?charset=utf8mb4
          SECRET_KEY: test-secret-key-for-ci
          SCHEDULER_ENABLED: "false"
          DEBUG: "false"
        run: |
          python -c "from app.database import engine, Base; import app.models; Base.metadata.create_all(bind=engine)"
          alembic upgrade head

      # 种子 ADMIN/admin@2026（E2E auth.setup.ts 登录依赖，勿删）
      - name: Seed admin user
        working-directory: backend
        env:
          DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/ir_e2e?charset=utf8mb4
          SECRET_KEY: test-secret-key-for-ci
          SCHEDULER_ENABLED: "false"
          DEBUG: "false"
        run: python scripts/init_data.py

      - name: Start backend
        working-directory: backend
        env:
          DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/ir_e2e?charset=utf8mb4
          SECRET_KEY: test-secret-key-for-ci
          SCHEDULER_ENABLED: "false"
          DEBUG: "false"
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../backend-e2e.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/health

      # ---- 前端：生产构建 + webServer 由 playwright.config.ts 自动起 standalone server.js（:3000）----
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # E2E 跑生产构建形态（issue #171）：standalone server.js 与 Docker
      # 容器完全同形态（next start 与 output:'standalone' 不兼容）；
      # API_BASE_URL 默认 localhost:8000，build 时固化的 rewrites 恰与
      # 本 job 后端地址一致，无需额外传参。
      # standalone 不包含 public/ 与 .next/static/，组装步骤与 Dockerfile 一致。
      - name: Build frontend (production)
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm run build
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public

      # 浏览器二进制缓存（issue #172）：key 绑定 package-lock.json
      # （@playwright/test 版本决定所需浏览器构建）；未命中时回退全新安装
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      # 桌面 chromium + 移动 webkit（mobile 用 iPhone 13 描述符，
      # 见 playwright.config.ts 注释；PR #169 遗留的 webkit 307 取消问题
      # 已定位为 dev 竞态并修复，恢复真实 Safari 内核覆盖）。
      # 拆步 + 预置 apt-get update：--with-deps 内置 update 遇首选镜像
      # （azure.archive.ubuntu.com）不可达时会长时间重试卡死；先单独
      # update 让 apt 完成镜像回退，后续内置 update 全 Hit 很快。
      # timeout-minutes 兼作快速失败护栏（正常 ≤5 分钟）。
      - name: Update apt index
        run: sudo apt-get update

      - name: Install Playwright chromium
        working-directory: frontend
        timeout-minutes: 15
        run: npx playwright install --with-deps chromium

      - name: Install Playwright webkit
        working-directory: frontend
        timeout-minutes: 15
        run: npx playwright install --with-deps webkit

      - name: Run Playwright tests
        working-directory: frontend
        env:
          CI: "true"
        run: npx playwright test

      # 失败证据（trace/截图/视频）+ 后端启动日志（后端启动失败时的定位证据，
      # issue #172），always 上传保证失败时也能取到
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
            backend-e2e.log
          retention-days: 14

  # Dockerfile 构建冒烟（issue #170）：每个 PR 验证两个 Dockerfile 可构建，
  # 避免「构建问题合入 main 触发 CD 才暴露」（#141 ACR 拒推 provenance 即此类）。
  # 与 deploy.yml 共用 gha 缓存 scope（相互预热）；push: false 不产生 ACR tag。
  docker-build-smoke:
    name: "Docker Build Smoke (${{ matrix.service }})"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - service: backend
            context: .
            dockerfile: backend/Dockerfile
            build_args: ""
          - service: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
            # rewrites 在 build 时固化，与 deploy.yml 保持一致
            build_args: |
              API_BASE_URL=http://backend:8000

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.service }} image (no push)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          build-args: ${{ matrix.build_args }}
          tags: investring-${{ matrix.service }}:smoke
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          # 与 deploy.yml 一致：ACR 个人版不支持 OCI attestation（issue #141）
          provenance: false
          sbom: false
