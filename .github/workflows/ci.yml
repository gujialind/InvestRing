# ============================================================================
# InvestRing CI 持续集成流水线
# ============================================================================
# 触发条件：push 或 pull request 到 main/develop 分支
# 包含两个并行的 Job：Backend CI 和 Frontend CI
# ============================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# 并发控制：同一分支/PR 只保留最新的运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # 后端 CI：Python 代码检查 + 单元测试 + 迁移校验
  # ==========================================================================
  backend-ci:
    name: "Backend CI"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # 使用 MySQL 服务容器供测试使用
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: investring_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 设置 Python 环境
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. 缓存 pip 依赖（加速后续构建）
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          # 以 requirements.txt 的哈希值作为缓存 key，依赖变更时自动刷新
          key: pip-${{ runner.os }}-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      # 4. 安装依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # 安装 CI 专用工具
          pip install ruff pytest-cov

      # 5. Ruff 代码规范检查（替代 Flake8，速度更快）
      - name: Lint with Ruff
        run: |
          # 检查代码规范（不自动修复）
          ruff check app/ --output-format=github
          # 检查代码格式
          ruff format --check app/

      # 6. 运行测试（单元 + 集成 + E2E）
      - name: Run tests with pytest
        env:
          # 注入测试环境变量
          TEST_DB_URL: mysql+pymysql://root:test_password@127.0.0.1:3306/investring_test?charset=utf8mb4
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: test_password
          DB_NAME: investring_test
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: "True"
        run: |
          pytest tests/ \
            --tb=short \
            --strict-markers \
            -v \
            --cov=app \
            --cov-fail-under=70 \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      # 7. Alembic 迁移脚本校验（确保迁移文件语法正确且可执行）
      - name: Validate Alembic migrations
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: test_password
          DB_NAME: investring_test
        run: |
          # 检查是否存在 Alembic 配置
          if [ -f "alembic.ini" ] || [ -d "alembic" ]; then
            echo "校验 Alembic 迁移脚本..."
            # 验证迁移历史链完整性（不实际执行迁移）
            alembic history --verbose || echo "⚠️ Alembic 配置不完整，跳过迁移校验"
            # 尝试执行 upgrade head 验证迁移可正常运行
            alembic upgrade head || echo "⚠️ 迁移执行失败，请检查迁移文件"
          else
            echo "⚠️ 未检测到 Alembic 配置，跳过迁移校验"
          fi

      # 8. 上传测试覆盖率报告（仅 main 分支）
      - name: Upload coverage report
        if: github.ref == 'refs/heads/main' && success()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 7

  # ==========================================================================
  # 前端 CI：代码检查 + 类型检查 + 构建测试
  # ==========================================================================
  frontend-ci:
    name: "Frontend CI"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 设置 Node.js 环境
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          # 自动配置 npm 缓存
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # 3. 安装依赖（使用 ci 确保锁文件一致性）
      - name: Install dependencies
        run: npm ci

      # 4. ESLint 代码规范检查
      - name: Lint with ESLint
        run: npm run lint -- --max-warnings=0

      # 5. TypeScript 类型检查（不生成输出文件）
      - name: Type check with TypeScript
        run: npx tsc --noEmit

      # 6. Next.js 生产环境构建测试
      - name: Build Next.js application
        env:
          # 构建时注入环境变量（Next.js 构建阶段需要）
          NEXT_PUBLIC_API_URL: http://localhost:8000
          API_BASE_URL: http://localhost:8000
          NODE_ENV: production
        run: npm run build

      # 7. 上传构建产物（供 CD 流程使用，可选）
      - name: Upload build artifacts
        if: github.ref == 'refs/heads/main' && success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: |
            frontend/.next/
            frontend/public/
            frontend/package.json
            frontend/package-lock.json
          retention-days: 3

  # ==========================================================================
  # 前端 E2E CI：Playwright 端到端测试
  # ==========================================================================
  frontend-e2e:
    name: "Frontend E2E"
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    defaults:
      run:
        working-directory: frontend

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: investring_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 启动后端 API 服务
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          cd ../backend
          pip install -r requirements.txt

      - name: Start backend API
        env:
          TEST_DB_URL: mysql+pymysql://root:test_password@127.0.0.1:3306/investring_test?charset=utf8mb4
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: test_password
          DB_NAME: investring_test
          SECRET_KEY: test-secret-key-for-ci
        run: |
          cd ../backend
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 5

      # 前端 E2E
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          API_BASE_URL: http://localhost:8000
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
