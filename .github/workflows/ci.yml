# ============================================================================
# InvestRing CI 持续集成流水线
# ============================================================================
# 范围：后端测试 + CLI 契约校验 + 前端 lint/类型/构建门禁 + 前端 E2E（issue #168）
# 触发条件：push 或 pull request 到 main/dev 分支
# 测试数据库：
#   - SQLite（conftest.py 默认模式，快速反馈）
#   - MySQL 8.4 service 容器（对齐生产 RDS，覆盖方言差异 + 迁移链验证）
# ============================================================================

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# 并发控制：同一源分支只保留最新的运行。
# head_ref（PR 源分支名）优先，push 事件回落到 ref_name（分支名），
# 使 push 到 dev 与 dev→main PR 落入同一组，避免同一 commit 重复运行。
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: "Backend Tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Python 版本与生产镜像（python:3.12-slim）保持一致
      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # SQLite 模式运行全量测试（unit + integration + e2e）
      - name: Run tests with pytest
        env:
          SECRET_KEY: test-secret-key-for-ci
          SCHEDULER_ENABLED: "false"
        run: |
          pytest tests/ -q --tb=short --strict-markers

  # MySQL 门禁：覆盖 SQLite 测不出的方言差异（VARCHAR 长度、DECIMAL 截断、
  # 隐式排序、排序规则等），并验证生产启动顺序（create_all → alembic upgrade head）
  backend-test-mysql:
    name: "Backend Tests (MySQL)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 库级排序规则对齐生产 RDS（utf8mb3_general_ci，建表默认继承库级设置）
      - name: Create databases
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "
            CREATE DATABASE ir_test CHARACTER SET utf8mb3 COLLATE utf8mb3_general_ci;
            CREATE DATABASE ir_migration CHARACTER SET utf8mb3 COLLATE utf8mb3_general_ci;"

      # 复刻生产启动顺序：main.py import 期 create_all 建全表，lifespan 内 upgrade head 增量修补
      - name: Verify migration chain (create_all + alembic upgrade head)
        env:
          DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/ir_migration?charset=utf8mb4
          SECRET_KEY: test-secret-key-for-ci
          SCHEDULER_ENABLED: "false"
          DEBUG: "false"
        run: |
          python -c "from app.database import engine, Base; import app.models; Base.metadata.create_all(bind=engine)"
          alembic upgrade head
          alembic current | grep "(head)"

      - name: Run tests with pytest (MySQL)
        env:
          TEST_DB_URL: mysql+pymysql://root:root@127.0.0.1:3306/ir_test?charset=utf8mb4
          SECRET_KEY: test-secret-key-for-ci
          SCHEDULER_ENABLED: "false"
          DEBUG: "false"
        run: |
          pytest tests/ -q --tb=short --strict-markers

  # ir-cli 响应字段契约防漂移校验：纯 stdlib 脚本，无需安装依赖/启动后端
  cli-contract-check:
    name: "CLI Contract Check"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # 不一致时 exit 1：请运行 `python ir-cli/scripts/gen_response_fields.py` 重新生成并提交
      - name: Check response fields contract
        run: |
          python ir-cli/scripts/gen_response_fields.py --check

  # 前端门禁：前端已容器化部署，类型/语法错误与构建失败必须在 CI 拦住
  # （历史上因无前端门禁漏过任务页 map 崩溃等问题）
  frontend-check:
    name: "Frontend Lint & Build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Node 版本与 frontend/Dockerfile、frontend/.nvmrc 保持一致
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npx tsc --noEmit

      # next build 内部也会跑 lint + tsc，但单独前置两步能更快定位失败原因
      - name: Next.js build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  # 前端 E2E 门禁（issue #168）：真实浏览器验证登录/页面渲染/防 P0 复发，
  # 拦截"接口正确但用户用不了"的问题（白屏崩溃、死链、双导航等）。
  # 后端跑在 MySQL 8.4 上（对齐 backend-test-mysql 的"对齐生产 RDS"哲学）。
  #
  # 运行前提（勿删）：
  #   - E2E 登录用例依赖 ADMIN/admin@2026 用户，该用户不会随后端启动自动创建，
  #     必须由 scripts/init_data.py 种子产生，删除 seed 步骤登录必挂
  #   - 前端 next.config.js 将 /api/* rewrite 到 localhost:8000，故需真实后端
  frontend-e2e:
    name: "Frontend E2E"
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # ---- 后端：建库 → 迁移 → seed → 启动（生产启动顺序：create_all 由 main.py import 期完成）----
      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 库级排序规则对齐 backend-test-mysql（utf8mb3_general_ci）
      - name: Create database
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "
            CREATE DATABASE ir_e2e CHARACTER SET utf8mb3 COLLATE utf8mb3_general_ci;"

      - name: Run migrations
        working-directory: backend
        env:
          DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/ir_e2e?charset=utf8mb4
          SECRET_KEY: test-secret-key-for-ci
          SCHEDULER_ENABLED: "false"
          DEBUG: "false"
        run: alembic upgrade head

      # 种子 ADMIN/admin@2026（E2E auth.setup.ts 登录依赖，勿删）
      - name: Seed admin user
        working-directory: backend
        env:
          DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/ir_e2e?charset=utf8mb4
          SECRET_KEY: test-secret-key-for-ci
          SCHEDULER_ENABLED: "false"
          DEBUG: "false"
        run: python scripts/init_data.py

      - name: Start backend
        working-directory: backend
        env:
          DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/ir_e2e?charset=utf8mb4
          SECRET_KEY: test-secret-key-for-ci
          SCHEDULER_ENABLED: "false"
          DEBUG: "false"
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../backend-e2e.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/health

      # ---- 前端：webServer 由 playwright.config.ts 自动起 npm run dev（:3000）----
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # 桌面/移动双 project 同为 chromium 内核（mobile 用 Pixel 5 描述符，
      # 见 playwright.config.ts 注释），无需装全量浏览器
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: frontend
        env:
          CI: "true"
        run: npx playwright test

      # 失败证据（trace/截图/视频）供定位，always 上传保证失败时也能取到
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
