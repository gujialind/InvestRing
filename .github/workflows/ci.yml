# ============================================================================
# InvestRing CI 持续集成流水线
# ============================================================================
# 范围：仅后端测试（前端未部署，暂不纳入 CI 门禁）
# 触发条件：push 或 pull request 到 main/dev 分支
# 测试数据库：SQLite（conftest.py 默认模式，本地与 CI 行为一致）
# ============================================================================

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# 并发控制：同一分支/PR 只保留最新的运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: "Backend Tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Python 版本与生产镜像（python:3.11-slim）保持一致
      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # SQLite 模式运行全量测试（unit + integration + e2e）
      - name: Run tests with pytest
        env:
          SECRET_KEY: test-secret-key-for-ci
          SCHEDULER_ENABLED: "false"
        run: |
          pytest tests/ -q --tb=short --strict-markers
