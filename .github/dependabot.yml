# Dependabot 版本更新（issue #252）：每周检查三类生态的依赖升级并自动提 PR。
# 与 Security Scan（security-scan.yml）互补：告警发现漏洞，这里提升级 PR。
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    ignore:
      # TS 7 为 Go 原生编译器（tsgo），typescript-eslint / eslint-config-next 尚不支持，
      # 升级后 Frontend Lint & Build 必挂（见 PR #265 评估）。升 TS 7 需等工具链支持后
      # 走 feature 分支 + issue 评估；届时移除本忽略规则。
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
